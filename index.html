<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de niños</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F2;--card:#fff;--ink:#3A3350;--mute:#8C84A0;--line:#F1E6ED;
--brand:#FF8FAE;--brandDk:#F16F92;--brandBg:#FFE3EB;
--peach:#FFB27A;--peachBg:#FFEDDC;--peachInk:#8A4B12;
--sky:#7EC1EC;--skyBg:#E3F3FC;--skyInk:#2C6E96;
--mint:#7FD3AE;--mintBg:#E1F6EC;--mintInk:#1F7A55;
--lav:#AC96E0;--lavBg:#EFE8FB;--lavInk:#5E3FA8;
--rose:#F0729E;--roseBg:#FDE4ED;--roseInk:#A6265A;
--bad:#E4685A;--badBg:#FCE4E1;
--shadow:0 2px 6px rgba(58,51,80,.05),0 12px 28px rgba(58,51,80,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1826;--card:#241F33;--ink:#F1EDF9;--mute:#A79FC0;--line:#352E48;
--brand:#FF9FBB;--brandDk:#FFB2C9;--brandBg:#3D2530;
--peach:#FFC896;--peachBg:#402A18;--peachInk:#FFD9AE;
--sky:#8FCCF2;--skyBg:#1E3346;--skyInk:#BEE2FA;
--mint:#8FDFBB;--mintBg:#1B3A2C;--mintInk:#B7EDD1;
--lav:#C0AAEF;--lavBg:#2E2645;--lavInk:#D9C9F7;
--rose:#F492B4;--roseBg:#3B2130;--roseInk:#F7B8CE;
--bad:#F0897A;--badBg:#3E211D;
--shadow:0 2px 6px rgba(0,0,0,.25),0 12px 28px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#1B1826;--card:#241F33;--ink:#F1EDF9;--mute:#A79FC0;--line:#352E48;
--brand:#FF9FBB;--brandDk:#FFB2C9;--brandBg:#3D2530;
--peach:#FFC896;--peachBg:#402A18;--peachInk:#FFD9AE;
--sky:#8FCCF2;--skyBg:#1E3346;--skyInk:#BEE2FA;
--mint:#8FDFBB;--mintBg:#1B3A2C;--mintInk:#B7EDD1;
--lav:#C0AAEF;--lavBg:#2E2645;--lavInk:#D9C9F7;
--rose:#F492B4;--roseBg:#3B2130;--roseInk:#F7B8CE;
--bad:#F0897A;--badBg:#3E211D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;
background:
radial-gradient(560px 380px at 100% -6%, var(--lavBg) 0%, transparent 62%),
radial-gradient(460px 340px at -8% 10%, var(--mintBg) 0%, transparent 58%),
radial-gradient(600px 420px at 96% 55%, var(--skyBg) 0%, transparent 55%),
radial-gradient(420px 320px at 4% 95%, var(--brandBg) 0%, transparent 55%),
var(--bg);
background-attachment:fixed}
main{max-width:720px;margin:0 auto;padding:0 16px 56px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:18px 0 14px;margin-bottom:14px}
.top::before{content:'🌱';font-size:1em;margin-right:8px}
h1{font:600 clamp(22px,5vw,28px)/1.15 Fraunces,Georgia,serif;margin:0;display:inline-flex;align-items:center}
h2{font:600 18px/1.2 Fraunces,Georgia,serif;margin:0 0 14px}
main>h2{margin:28px 2px 12px}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--rose),var(--lav),var(--sky))}
.card.hero::before,.card.empty::before,.login-card::before{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:13px;letter-spacing:.01em;color:var(--mute);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--lav)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.hint,.note{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.4}
button{font:inherit;font-size:14px;font-weight:800;border:0;border-radius:999px;padding:11px 20px;min-height:44px;cursor:pointer;background:var(--brand);color:#fff;transition:filter .15s,transform .1s;box-shadow:0 4px 14px rgba(240,114,158,.32)}
button:hover{filter:brightness(1.05)}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.sec:hover{border-color:var(--lav);color:var(--lavInk)}
button.bad{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#nav{padding:6px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
#nav button{box-shadow:none}
#nav button[data-act="add"]{background:var(--brand)}
#nav button.sec{border-color:transparent;background:transparent;color:var(--ink)}
#nav button.sec[data-act="export"]:hover{background:var(--mintBg);color:var(--mintInk)}
#nav button.sec[data-act="cfg"]:hover{background:var(--lavBg);color:var(--lavInk)}
#nav button.sec[data-act="out"]:hover{background:var(--roseBg);color:var(--roseInk)}

/* Pantalla de bienvenida */
body.login-view main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
body.login-view .top,body.login-view footer.note{display:none}
.login-card{max-width:420px;width:100%;text-align:center;padding:36px 28px 30px;border-radius:28px}
.login-card::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,var(--roseBg) 0%,transparent 40%,var(--skyBg) 100%);opacity:.6;z-index:-1}
.login-badge{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,var(--mint),var(--sky))}
.login-title{font:600 clamp(26px,7vw,32px)/1.1 Fraunces,Georgia,serif;margin:0 0 8px}
.login-sub{color:var(--mute);font-size:14.5px;margin:0 0 22px;line-height:1.5}
.login-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.login-tags span{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.login-tags span:nth-child(1){background:var(--roseBg);color:var(--roseInk)}
.login-tags span:nth-child(2){background:var(--mintBg);color:var(--mintInk)}
.login-tags span:nth-child(3){background:var(--skyBg);color:var(--skyInk)}

/* Fila de niño en la lista: avatar de color según sexo */
.kid{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.kid:hover{border-color:var(--lav);transform:translateY(-2px)}
.kid::before{content:attr(data-ini);grid-row:1/3;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 17px Fraunces,Georgia,serif;background:var(--skyBg);color:var(--skyInk);flex-shrink:0}
.kid[data-sx="f"]::before{background:var(--roseBg);color:var(--roseInk)}
.kid[data-sx="m"]::before{background:var(--skyBg);color:var(--skyInk)}
.kid[data-sx=""]::before{background:var(--peachBg);color:var(--peachInk)}
.kid b{grid-column:2;font-size:16px;font-weight:800}
.kid .a{grid-column:2;color:var(--mute);font-weight:600;font-size:13.5px}
.chip{grid-column:3;align-self:center;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--mintBg);color:var(--mintInk);white-space:nowrap}
.chip.warn{background:var(--peachBg);color:var(--peachInk)}.chip.late{background:var(--badBg);color:var(--bad)}

.hero{background:linear-gradient(135deg,var(--peach),var(--brand));color:#fff;border:0;text-align:center;padding:30px 16px;position:relative}
.hero::after{content:'🎉';position:absolute;font-size:26px;top:14px;right:18px;opacity:.9}
.hero .age{font:600 clamp(30px,8vw,46px)/1.05 Fraunces,Georgia,serif;margin:8px 0}
.hero p{margin:0;font-weight:700;font-size:14px;opacity:.97}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-radius:14px;padding:12px;text-align:center}
.stat:nth-child(1){background:var(--skyBg)}.stat:nth-child(1) b{color:var(--skyInk)}
.stat:nth-child(2){background:var(--mintBg)}.stat:nth-child(2) b{color:var(--mintInk)}
.stat:nth-child(3){background:var(--peachBg)}.stat:nth-child(3) b{color:var(--peachInk)}
.stat:nth-child(4){background:var(--lavBg)}.stat:nth-child(4) b{color:var(--lavInk)}
.stat b{display:block;font:600 22px/1.1 Fraunces,Georgia,serif}.stat span{font-size:12.5px;color:var(--mute);font-weight:600}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.tl li:first-child{border-top:0;padding-top:2px}
.tl .t{font-weight:800;font-size:14.5px}.tl .d{font-size:13px;color:var(--mute)}
.tl .s{grid-row:1/3;grid-column:2;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--mintBg);color:var(--mintInk);white-space:nowrap}
.tl li.next .s{background:var(--peachBg);color:var(--peachInk)}.tl li.done .t{color:var(--mute);font-weight:700}
.tl button{min-height:34px;padding:4px 14px;grid-row:1/3;grid-column:2}

/* Colores pastel por área de desarrollo */
:root{--mg:#5B93C9;--mgBg:#E6F0FA;--mf:#9679D1;--mfBg:#F0E9FB;--le:#E08A4C;--leBg:#FDEEDF;--co:#4FAF8B;--coBg:#E1F5ED;--se:#E06B96;--seBg:#FCE6EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mg:#8FBEE9;--mgBg:#22364C;--mf:#C2A9F0;--mfBg:#2F2748;--le:#F2B37E;--leBg:#40301E;--co:#82DAB4;--coBg:#1C3A2E;--se:#F19FBE;--seBg:#3C2434}}
:root[data-theme="dark"]{--mg:#8FBEE9;--mgBg:#22364C;--mf:#C2A9F0;--mfBg:#2F2748;--le:#F2B37E;--leBg:#40301E;--co:#82DAB4;--coBg:#1C3A2E;--se:#F19FBE;--seBg:#3C2434}
.tl li.a-mg,.tl li.a-mf,.tl li.a-le,.tl li.a-co,.tl li.a-se{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-left:12px;border-left:4px solid transparent;border-top:1px solid var(--line)}
.tl li.a-mg:first-child,.tl li.a-mf:first-child,.tl li.a-le:first-child,.tl li.a-co:first-child,.tl li.a-se:first-child{border-top:0}
.area-tag{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.tl li.a-mg{border-left-color:var(--mg)}.tl li.a-mg .area-tag{background:var(--mgBg);color:var(--mg)}
.tl li.a-mf{border-left-color:var(--mf)}.tl li.a-mf .area-tag{background:var(--mfBg);color:var(--mf)}
.tl li.a-le{border-left-color:var(--le)}.tl li.a-le .area-tag{background:var(--leBg);color:var(--le)}
.tl li.a-co{border-left-color:var(--co)}.tl li.a-co .area-tag{background:var(--coBg);color:var(--co)}
.tl li.a-se{border-left-color:var(--se)}.tl li.a-se .area-tag{background:var(--seBg);color:var(--se)}
.tl li.a-mg .d,.tl li.a-mf .d,.tl li.a-le .d,.tl li.a-co .d,.tl li.a-se .d{flex:1 1 220px}
.tl li.a-mg button,.tl li.a-mf button,.tl li.a-le button,.tl li.a-co button,.tl li.a-se button{margin-left:auto}

.empty{color:var(--mute);text-align:center;padding:40px 18px}
.empty::before{content:'🌼';display:block;font-size:34px;margin-bottom:10px}
.msg{min-height:20px;font-size:13.5px;color:var(--mintInk);font-weight:700;margin-top:8px}
footer.note{text-align:center;margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<div class="top"><h1>Seguimiento de niños</h1>
<div class="btns" id="nav" style="display:none"><button data-act="add">＋ Agregar niño</button><button class="sec" data-act="export">⬇ Descargar registro</button><button class="sec" data-act="cfg">⚙ Configuración</button><button class="sec" data-act="out">Salir</button></div></div>
<div id="app"></div>
<footer class="note">Tus datos se guardan en tu cuenta. Las fechas de control son referencias: confirma el calendario con el pediatra.</footer>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
