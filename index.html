<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de niños</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F0;--card:#fff;--ink:#1D2B28;--mute:#5F706B;--line:#DCE5DF;--acc:#E9A23B;--accInk:#3A2705;--teal:#4E9A90;--tealBg:#E2F0ED;--bad:#B4432F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A18;--card:#1B2624;--ink:#EAF2EE;--mute:#9AB0AA;--line:#2A3936;--acc:#F0B455;--accInk:#2B1C02;--teal:#6CC0B5;--tealBg:#20332F;--bad:#F08A73}}
:root[data-theme="dark"]{--bg:#121A18;--card:#1B2624;--ink:#EAF2EE;--mute:#9AB0AA;--line:#2A3936;--acc:#F0B455;--accInk:#2B1C02;--teal:#6CC0B5;--tealBg:#20332F;--bad:#F08A73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 clamp(26px,6vw,34px)/1.1 Fraunces,Georgia,serif;margin:0}
h2{font:600 20px/1.2 Fraunces,Georgia,serif;margin:0 0 12px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hint,.note{font-size:13px;color:var(--mute);margin-top:4px}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;background:var(--teal);color:#fff}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.kid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;border-radius:16px}
.kid b{font-size:17px}.kid .a{color:var(--mute);font-weight:600}
.chip{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--tealBg);color:var(--teal);white-space:nowrap}
.chip.warn{background:var(--acc);color:var(--accInk)}.chip.late{background:var(--bad);color:#fff}
.hero{background:var(--acc);color:var(--accInk);border:0;text-align:center;padding:24px 16px}
.hero .age{font:600 clamp(32px,9vw,54px)/1.05 Fraunces,Georgia,serif;margin:6px 0}
.hero p{margin:0;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--tealBg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 22px/1.1 Fraunces,Georgia,serif}.stat span{font-size:13px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.tl li:first-child{border-top:0}.tl .t{font-weight:800}.tl .d{font-size:14px;color:var(--mute)}
.tl .s{grid-row:1/3;grid-column:2;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--tealBg);color:var(--teal);white-space:nowrap}
.tl li.next .s{background:var(--acc);color:var(--accInk)}.tl li.done .t{color:var(--mute)}
.tl button{min-height:36px;padding:4px 12px;grid-row:1/3;grid-column:2}
.empty{color:var(--mute);text-align:center}
.msg{min-height:20px;font-size:14px;color:var(--teal);font-weight:600;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Seguimiento de niños</h1>
<div class="btns" id="nav" style="display:none"><button data-act="add">Agregar niño</button><button class="sec" data-act="export">Descargar registro</button><button class="sec" data-act="cfg">Configuración</button><button class="sec" data-act="out">Salir</button></div></div>
<div id="app"></div>
<p class="note">Tus datos se guardan en tu cuenta. Las fechas de control son referencias: confirma el calendario con el pediatra.</p>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
