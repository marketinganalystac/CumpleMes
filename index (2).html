<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CumpleMes ✨ Cada Mes es una Aventura</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEFF;--card:#fff;--ink:#2E2540;--mute:#8577A3;--line:#EBE2FF;
--brand:#FF4D8D;--brandDk:#D6206A;--brandBg:#FFE1EC;
--peach:#FF9A3C;--peachBg:#FFEAD1;--peachInk:#8A4300;
--sky:#00B4D8;--skyBg:#D3F4FA;--skyInk:#00647A;
--mint:#12B886;--mintBg:#D3F7E9;--mintInk:#0B6B4F;
--lav:#7C4DFF;--lavBg:#EBE1FF;--lavInk:#4B24C4;
--rose:#FF4D8D;--roseBg:#FFE1EC;--roseInk:#B4125A;
--bad:#E5484D;--badBg:#FBE0DD;
--shadow:9px 9px 18px rgba(124,77,255,.14), -9px -9px 18px rgba(255,255,255,.9);
--shadow-sm:6px 6px 12px rgba(124,77,255,.12), -6px -6px 12px rgba(255,255,255,.9);
--shadow-in:inset 4px 4px 7px rgba(124,77,255,.14), inset -4px -4px 7px rgba(255,255,255,.9);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Modo oscuro solo si se activa manualmente (data-theme="dark"); no sigue al sistema */
:root[data-theme="dark"]{--bg:#211F2B;--card:#2C2938;--ink:#F1EDF9;--mute:#B0A8C4;--line:#3D3A4D;
--brand:#FF9FBB;--brandDk:#FFB2C9;--brandBg:#3D2530;
--peach:#FFC896;--peachBg:#402A18;--peachInk:#FFD9AE;
--sky:#8FCCF2;--skyBg:#1E3346;--skyInk:#BEE2FA;
--mint:#8FDFBB;--mintBg:#1B3A2C;--mintInk:#B7EDD1;
--lav:#C0AAEF;--lavBg:#2E2645;--lavInk:#D9C9F7;
--rose:#F492B4;--roseBg:#3B2130;--roseInk:#F7B8CE;
--bad:#F0897A;--badBg:#3E211D;
--shadow:0 2px 6px rgba(0,0,0,.28),0 12px 28px rgba(0,0,0,.30);
--shadow-sm:0 2px 6px rgba(0,0,0,.28);--shadow-in:inset 0 0 0 1px rgba(255,255,255,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.5 Nunito,system-ui,sans-serif;
background:
  radial-gradient(560px 420px at 8% -6%, rgba(255,77,141,.22), transparent 60%),
  radial-gradient(520px 400px at 108% 6%, rgba(124,77,255,.20), transparent 60%),
  radial-gradient(480px 360px at 50% 115%, rgba(0,180,216,.16), transparent 60%),
  var(--bg);
  background-attachment:fixed}
main{max-width:480px;margin:0 auto;padding:14px 12px 100px}
.ic{display:inline-flex;width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px}

/* Cabecera: banner ilustrado, sin apoyarse en texto */
.top{position:relative;top:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:26px 16px;margin:0 0 16px;border-radius:0 0 28px 28px;overflow:hidden;
  background:linear-gradient(135deg,var(--lav) 0%,var(--brand) 55%,var(--peach) 100%);
  box-shadow:var(--shadow)}
.top::before,.top::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.top::before{width:140px;height:140px;background:rgba(255,255,255,.18);top:-60px;left:-30px}
.top::after{width:100px;height:100px;background:rgba(255,255,255,.14);bottom:-45px;right:-15px}
h1{position:relative;z-index:1;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;font:700 clamp(19px,5.5vw,24px)/1.15 Quicksand,system-ui,sans-serif;text-shadow:0 2px 6px rgba(0,0,0,.15)}
h1 .ic{width:34px;height:34px;color:#fff;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
h1 .ic:nth-of-type(2){width:22px;height:22px;opacity:.85;margin-left:-6px}
h2{font:700 15px/1.2 Quicksand,system-ui,sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:7px}
h2 .ic{color:var(--brand);width:16px;height:16px}
main>h2{margin:20px 2px 10px}

.card{position:relative;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card.hero::before,.card.empty::before,.login-card::before{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:13px;letter-spacing:.01em;color:var(--mute);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--lav)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.hint,.note{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.4}
button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:14px;padding:10px 16px;min-height:42px;cursor:pointer;background:var(--brand);color:#fff;transition:filter .15s,transform .1s;box-shadow:var(--shadow-sm)}
button:hover{filter:brightness(1.05)}
button:active{transform:scale(.97);box-shadow:var(--shadow-in)}
button.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.sec:hover{border-color:var(--lav);color:var(--lavInk)}
button.bad{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* Pantalla de bienvenida */
body.login-view main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
body.login-view .top,body.login-view footer.note,body.login-view .bottomnav{display:none}
.login-card{max-width:420px;width:100%;text-align:center;padding:32px 26px 28px;border-radius:24px}
.login-badge{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,var(--mint),var(--sky));box-shadow:var(--shadow-sm)}
.login-badge .ic{width:30px;height:30px}
.login-title{font:700 clamp(24px,7vw,30px)/1.1 Quicksand,system-ui,sans-serif;margin:0 0 8px}
.login-sub{color:var(--mute);font-size:14px;margin:0 0 20px;line-height:1.5}
.login-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.login-tags span{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:12px}
.login-tags span:nth-child(1){background:var(--roseBg);color:var(--roseInk)}
.login-tags span:nth-child(2){background:var(--mintBg);color:var(--mintInk)}
.login-tags span:nth-child(3){background:var(--skyBg);color:var(--skyInk)}

/* Estadísticas resumen */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{border-radius:16px;padding:10px 6px;text-align:center;background:var(--card);box-shadow:var(--shadow)}
.stat .bub{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:#fff}
.stat .bub .ic{width:15px;height:15px}
.stat:nth-child(1) .bub{background:linear-gradient(160deg,var(--mint),var(--mintInk))}
.stat:nth-child(2) .bub{background:linear-gradient(160deg,var(--brand),var(--brandDk))}
.stat:nth-child(3) .bub{background:linear-gradient(160deg,var(--peach),var(--peachInk))}
.stat:nth-child(4) .bub{background:linear-gradient(160deg,var(--sky),var(--skyInk))}
.stat b{display:block;font:700 18px/1.1 Quicksand,system-ui,sans-serif}.stat span{font-size:9.5px;color:var(--mute);font-weight:700}

/* Fila de niño en la lista: avatar de color según sexo */
.kid{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform .1s}
.kid:hover{transform:translateY(-2px)}
.kid::before{content:attr(data-ini);grid-row:1/3;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:700 15px Quicksand,system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,var(--sky),var(--skyInk));flex-shrink:0}
.kid[data-sx="f"]::before{background:linear-gradient(160deg,var(--brand),var(--brandDk))}
.kid[data-sx="m"]::before{background:linear-gradient(160deg,var(--sky),var(--skyInk))}
.kid[data-sx=""]::before{background:linear-gradient(160deg,var(--peach),var(--peachInk))}
.kid b{grid-column:2;font-size:14px;font-weight:800}
.kid .a{grid-column:2;color:var(--mute);font-weight:600;font-size:12px}
.chip{grid-column:3;align-self:center;font-size:11px;font-weight:800;padding:5px 11px;border-radius:11px;background:var(--mintBg);color:var(--mintInk);white-space:nowrap}
.chip.warn{background:var(--peachBg);color:var(--peachInk)}.chip.late{background:var(--badBg);color:var(--bad)}

.hero{background:linear-gradient(120deg,var(--peach),var(--brand));color:#fff;border:0;text-align:center;padding:26px 16px;position:relative}
.hero .age{font:700 clamp(28px,8vw,42px)/1.05 Quicksand,system-ui,sans-serif;margin:8px 0}
.hero p{margin:0;font-weight:700;font-size:13px;opacity:.97}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 4px;align-items:center}
.tl .t{font-weight:700;font-size:13px}.tl .d{font-size:12px;color:var(--mute)}
.tl .s{grid-row:1/3;grid-column:2;font-size:11px;font-weight:800;padding:5px 11px;border-radius:11px;background:var(--mintBg);color:var(--mintInk);white-space:nowrap}
.tl li.next .s{background:var(--peachBg);color:var(--peachInk)}.tl li.done .t{color:var(--mute);font-weight:700}
.tl button{min-height:32px;padding:4px 12px;grid-row:1/3;grid-column:2}

/* Fecha de control expandible con seguimiento */
.tl li.ctl{display:block;padding:10px 4px}
.ctl-row{background:none;border:0;box-shadow:none;min-height:auto;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;width:100%;cursor:pointer;color:inherit;font:inherit;text-align:left}
.ctl-row:hover{text-decoration:underline}
.ctl-row .t{flex:1 1 100%}
.s-ok{font-size:10px;font-weight:800;color:var(--mintInk);background:var(--mintBg);padding:3px 9px;border-radius:9px;white-space:nowrap}
.ctl-panel{margin-top:9px;padding:12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-in);display:flex;flex-direction:column;gap:10px}
.plog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:6px 2px;border-bottom:1px solid var(--line)}
.plog:last-of-type{border-bottom:0}

/* Colores por área de desarrollo */
:root{--mg:#3F87CE;--mgBg:#DCEBFA;--mf:#8E5FDB;--mfBg:#EBE1FA;--le:#E7862E;--leBg:#FCE7CE;--co:#4FAF88;--coBg:#DBF3E7;--se:#E85F80;--seBg:#FBE0E6}
:root[data-theme="dark"]{--mg:#8FBEE9;--mgBg:#22364C;--mf:#C2A9F0;--mfBg:#2F2748;--le:#F2B37E;--leBg:#40301E;--co:#82DAB4;--coBg:#1C3A2E;--se:#F19FBE;--seBg:#3C2434}
.tl li.a-mg,.tl li.a-mf,.tl li.a-le,.tl li.a-co,.tl li.a-se{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 10px;border-radius:12px;background:var(--card);box-shadow:var(--shadow-in);margin-bottom:6px}
.area-tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;white-space:nowrap}
.tl li.a-mg .area-tag{background:var(--mgBg);color:var(--mg)}
.tl li.a-mf .area-tag{background:var(--mfBg);color:var(--mf)}
.tl li.a-le .area-tag{background:var(--leBg);color:var(--le)}
.tl li.a-co .area-tag{background:var(--coBg);color:var(--co)}
.tl li.a-se .area-tag{background:var(--seBg);color:var(--se)}
.tl li.a-mg .d,.tl li.a-mf .d,.tl li.a-le .d,.tl li.a-co .d,.tl li.a-se .d{flex:1 1 220px}
.tl li.a-mg button,.tl li.a-mf button,.tl li.a-le button,.tl li.a-co button,.tl li.a-se button{margin-left:auto}

.empty{color:var(--mute);text-align:center;padding:40px 18px}
.empty::before{content:'🌼';display:block;font-size:34px;margin-bottom:10px}
.msg{min-height:20px;font-size:13.5px;color:var(--mintInk);font-weight:700;margin-top:8px}
footer.note{text-align:center;margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px}

/* Panel de navegación inferior */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bottomnav-inner{max-width:480px;width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;justify-content:space-around;padding:7px 4px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;box-shadow:none;padding:6px 8px;border-radius:13px;color:var(--mute);font-size:9.5px;font-weight:800;cursor:pointer;min-height:auto}
.nav-item .ic{width:18px;height:18px}
.nav-item.active{background:linear-gradient(160deg,var(--brand),var(--brandDk));color:#fff;box-shadow:var(--shadow-sm)}
</style>
</head>
<body>
<main>
<div class="top"><h1><svg class="ic" viewBox="0 0 24 24"><path d="M12 2c-3 3-4 6-4 9a4 4 0 0 0 8 0c0-3-1-6-4-9Z"/><path d="M8 15c-2 1-3 3-3 5"/><path d="M16 15c2 1 3 3 3 5"/></svg><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 10l-4.6 3.6L16.8 20 12 16.6 7.2 20l1.4-6.4L4 10l5.8-1.4Z"/></svg><span>CumpleMes ✨ Cada Mes es una Aventura</span></h1></div>
<div id="app"></div>
<footer class="note">Tus datos se guardan en tu cuenta. Las fechas de control son referencias: confirma el calendario con el pediatra.</footer>
</main>
<nav class="bottomnav btns" id="nav" style="display:none">
  <div class="bottomnav-inner">
    <button class="nav-item active" data-act="back"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button class="nav-item" data-act="add"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar</button>
    <button class="nav-item" data-act="export"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>Registro</button>
    <button class="nav-item" data-act="cfg"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Ajustes</button>
    <button class="nav-item" data-act="out"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Salir</button>
  </div>
</nav>
<script type="module" src="/src/main.js"></script>
</body>
</html>
